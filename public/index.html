
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NepalDate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>NepalDate</h1>

    <h2>Today's Nepali Date</h2>
    <p id="today">Loading...</p>

    <hr>

    <h2>AD to BS</h2>
    <input type="date" id="adDate">
    <button id="adButton">Convert</button>
    <p id="adResult"></p>

    <hr>

    <h2>BS to AD</h2>
    <input type="text" id="bsDate" placeholder="YYYY-MM-DD">
    <button id="bsButton">Convert</button>
    <p id="bsResult"></p>

    <script src="script.js"></script>
</body>
</html>
